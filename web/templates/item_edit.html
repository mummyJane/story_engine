{% extends "base.html" %}
{% block content %}
<h1>{% if record %}Edit item: {{ name }}{% else %}Add item{% endif %}</h1>

<form method="post" action="/projects/{{ project_name }}/bible/items/save">
  <label>
    Name:
    <input type="text" name="name" value="{{ name }}">
  </label>

  <label>
    Description:
    <textarea name="description">{% if record %}{{ record.description }}{% endif %}</textarea>
  </label>

  <label>
    Owner (character name):
    <input type="text" name="owner" value="{% if record and record.owner %}{{ record.owner }}{% endif %}">
  </label>

  <label>
    Location:
    <input type="text" name="location" value="{% if record and record.location %}{{ record.location }}{% endif %}">
  </label>

  <label>
    State:
    <input type="text" name="state" value="{% if record %}{{ record.state }}{% else %}intact{% endif %}">
  </label>

  <label>
    Tags (comma or line separated):
    <textarea name="tags">{% if record %}{{ ', '.join(record.tags) }}{% endif %}</textarea>
  </label>

  <button type="submit">Save</button>
</form>

{% endblock %}
