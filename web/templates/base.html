<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ title or "Story Engine" }}</title>
<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 1100px;
    margin: 1rem auto;
    background-color: #121212;
    color: #e0e0e0;
  }

  a {
    color: #80d0ff;
  }

  nav a {
    margin-right: 1rem;
  }

  textarea,
  input[type="text"],
  input[type="number"],
  input[type="password"],
  select {
    width: 100%;
    background-color: #1e1e1e;
    color: #e0e0e0;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 0.4rem;
  }

  textarea {
    min-height: 8rem;
  }

  pre {
    white-space: pre-wrap;
    font-family: monospace;
    border: 1px solid #444;
    padding: 0.5rem;
    background-color: #1b1b1b;
  }

  label {
    display: block;
    margin-bottom: 0.5rem;
  }

  form {
    margin-bottom: 1rem;
  }

  button,
  input[type="submit"] {
    background-color: #2b2b2b;
    color: #e0e0e0;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 0.4rem 0.8rem;
    cursor: pointer;
  }

  button:hover,
  input[type="submit"]:hover {
    background-color: #3a3a3a;
  }

  hr {
    border-color: #333;
  }
</style>

</head>
<body>
  <nav>
    <a href="/">Stories</a>
    {% if project_name is defined %}
      |
      <a href="/projects/{{ project_name }}/project">Project</a>
      <a href="/projects/{{ project_name }}/bible">Bible</a>
      <a href="/projects/{{ project_name }}/timeline">Timeline</a>
      <a href="/projects/{{ project_name }}/notes">Notes</a>
    {% endif %}
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
